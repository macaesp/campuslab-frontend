<h1 class="heading" style="font-size:22px; margin-bottom:20px;">Auditoría</h1>

<div class="panel">
  <div class="filters">
    <input class="field-input" placeholder="Usuario…" [(ngModel)]="filtroUsuario" (change)="buscar()" />
    <input class="field-input" type="date" [(ngModel)]="filtroDesde" (change)="buscar()" />
    <input class="field-input" type="date" [(ngModel)]="filtroHasta" (change)="buscar()" />
    <select class="field-input" [(ngModel)]="filtroTipo" (change)="buscar()">
      <option value="">Todas las acciones</option>
      <option value="SOLICITO">Solicitó</option>
      <option value="APROBO">Aprobó</option>
      <option value="ENTREGO">Entregó</option>
      <option value="RECIBIO">Recibió</option>
      <option value="DEVOLVIO">Devolvió</option>
      <option value="CANCELO">Canceló</option>
    </select>
  </div>

  <table class="table" *ngIf="!loading; else loadingTpl">
    <thead><tr><th>Fecha / hora</th><th>Persona</th><th>Rol</th><th>Acción</th><th>Objeto</th><th>Sede</th></tr></thead>
    <tbody>
      <tr *ngFor="let e of events">
        <td class="mono">{{ e.timestamp }}</td>
        <td>{{ e.actorNombre }}</td>
        <td>{{ e.actorRol }}</td>
        <td>{{ e.accion }}</td>
        <td class="mono">{{ e.objeto }}</td>
        <td>{{ e.sede }}</td>
      </tr>
    </tbody>
  </table>
  <ng-template #loadingTpl><p class="text-muted">Cargando timeline (GET /api/audit/events)…</p></ng-template>
  <p *ngIf="!loading && events.length === 0" class="text-muted">Sin eventos que coincidan con la búsqueda.</p>
</div>
