<div class="app-shell">
  <div class="mobile-header">
    <a class="mobile-brand" routerLink="/dashboard" (click)="menuOpen = false">⌁ CampusLab</a>
    <button type="button" class="menu-toggle" aria-controls="main-navigation-panel" [attr.aria-expanded]="menuOpen" (click)="menuOpen = !menuOpen">{{ menuOpen ? 'Cerrar menú' : '☰ Menú' }}</button>
  </div>
  <aside id="main-navigation-panel" class="sidebar" [class.mobile-open]="menuOpen" (keydown.escape)="menuOpen = false">
    <a class="brand" routerLink="/dashboard"><span class="brand-mark">⌁</span><span>Campus<span>Lab</span></span></a>
    <nav class="sidebar-nav">
      <a
        *ngFor="let item of items"
        [routerLink]="item.path"
        routerLinkActive="nav-item--active"
        class="nav-item"
        (click)="menuOpen = false"
      >
        <span class="nav-icon">{{ item.icon }}</span>
        {{ item.label }}
      </a>
    </nav>
    <div class="sidebar-bottom">
      <button class="nav-item" type="button" (click)="lookup().show()">Consultar reserva por código</button>
      <div class="profile"><span class="avatar">{{ roleService.displayName().slice(0, 1) }}</span><span>{{ roleService.displayName() }}<small>{{ roleService.getRoles().join(', ') || 'Sesión activa' }}</small></span></div>
      <label *ngIf="isDevelopment" class="role-switcher">
        <span>Vista de prueba</span>
        <select [(ngModel)]="selectedRole" (ngModelChange)="changeRole($event)">
          <option *ngFor="let role of roleOptions" [ngValue]="role">{{ roleService.labelFor(role) }}</option>
        </select>
      </label>
      <button class="nav-item nav-item--logout" (click)="logout()">Cerrar sesión</button>
    </div>
  </aside>
  <main class="main">
    <router-outlet></router-outlet>
  </main>
</div>
<cl-booking-lookup-dialog />
